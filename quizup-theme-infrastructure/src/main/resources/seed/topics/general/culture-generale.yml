        text: "Who painted this portrait of a woman exhibited at the Louvre Museum?"
        answers:
          A: "Michelangelo"
          B: "Sandro Botticelli"
          C: "Raphael"
          D: "Leonardo da Vinci"
  - text: "Quel peintre est l'auteur de ce tableau, La Nuit étoilée ?"
