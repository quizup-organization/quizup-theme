topic:
  id: topic-culture-generale
  name: "Culture générale"
  description: "Géographie, sciences, arts, sport et société : un mélange de questions variées pour tester votre culture générale sur tous les sujets."
  category: GENERAL
questions:
  - text: "Quelle mission spatiale a permis de prendre cette photographie de la Terre en 1972 ?"
    imageUrl: "https://commons.wikimedia.org/wiki/Special:FilePath/The_Earth_seen_from_Apollo_17.jpg?width=800"
    answers:
      A: "Apollo 11"
      B: "Apollo 13"
      C: "Apollo 17"
      D: "Gemini 4"
    correctAnswer: C
  - text: "Qui a peint ce portrait de femme exposé au musée du Louvre ?"
    imageUrl: "https://commons.wikimedia.org/wiki/Special:FilePath/Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg?width=800"
    answers:
      A: "Michel-Ange"
      B: "Léonard de Vinci"
      C: "Raphaël"
      D: "Sandro Botticelli"
    correctAnswer: B
  - text: "Quel peintre est l'auteur de ce tableau, La Nuit étoilée ?"
    imageUrl: "https://commons.wikimedia.org/wiki/Special:FilePath/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg?width=800"
    answers:
      A: "Claude Monet"
      B: "Paul Gauguin"
      C: "Paul Cézanne"
      D: "Vincent van Gogh"
    correctAnswer: D
  - text: "Quel artiste japonais a réalisé cette estampe, La Grande Vague de Kanagawa ?"
    imageUrl: "https://commons.wikimedia.org/wiki/Special:FilePath/The_Great_Wave_off_Kanagawa.jpg?width=800"
    answers:
      A: "Hokusai"
      B: "Hiroshige"
      C: "Sharaku"
      D: "Utamaro"
    correctAnswer: A
  - text: "Quelle planète du système solaire est photographiée ici par la sonde Cassini ?"
