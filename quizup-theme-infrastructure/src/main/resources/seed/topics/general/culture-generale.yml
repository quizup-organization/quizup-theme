topic:
  id: topic-culture-generale
  names:
    fr: "Culture générale"
    en: "General Knowledge"
  description: "Géographie, sciences, arts, sport et société : un mélange de questions variées pour tester votre culture générale sur tous les sujets."
  category: GENERAL
questions:
  - text: "Quelle mission spatiale a permis de prendre cette photographie de la Terre en 1972 ?"
    imageUrl: "https://commons.wikimedia.org/wiki/Special:FilePath/The_Earth_seen_from_Apollo_17.jpg?width=800"
    answers:
      A: "Apollo 11"
      B: "Apollo 13"
      C: "Apollo 17"
      D: "Gemini 4"
    correctAnswer: C
    translations:
      en:
        text: "Which space mission took this photograph of Earth in 1972?"
        answers:
          A: "Apollo 11"
          B: "Apollo 13"
          C: "Apollo 17"
          D: "Gemini 4"
  - text: "Qui a peint ce portrait de femme exposé au musée du Louvre ?"
    imageUrl: "https://commons.wikimedia.org/wiki/Special:FilePath/Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg?width=800"
    answers:
      A: "Michel-Ange"
      B: "Sandro Botticelli"
      C: "Raphaël"
      D: "Léonard de Vinci"
