  description: "Testez vos connaissances sur Minecraft, le célèbre jeu de construction et de survie. Des blocs et minerais aux mobs, biomes, outils, modes de jeu, faim et cycle jour/nuit, ce quiz de 50 questions couvre les fondamentaux du jeu. Bonne chance à tous les mineurs en herbe !"
  category: GAMES
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/MineCon2015ExpoHall.jpg?width=800
