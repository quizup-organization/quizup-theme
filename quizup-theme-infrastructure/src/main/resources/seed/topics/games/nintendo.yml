  description: "Testez vos connaissances sur Nintendo, l'entreprise japonaise fondée en 1889 devenue l'un des plus grands noms du jeu vidéo. Des consoles NES, Game Boy, Nintendo 64 et Switch aux licences Super Mario, The Legend of Zelda, Pokémon, Metroid, Kirby et Donkey Kong, ce thème couvre les machines cultes, leurs créateurs et les personnages emblématiques qui ont marqué des générations de joueurs."
