topic:
  id: topic-capitales-du-monde
  name: "Capitales du monde"
  description: "Des monuments célèbres aux grandes métropoles : retrouvez les capitales des pays du monde, associez chaque nation à sa ville capitale et voyagez d'un continent à l'autre."
  category: WORLD
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Tour_Eiffel_Wikimedia_Commons.jpg?width=800
questions:
  - text: "Dans quelle ville se trouve le Colisée, l'amphithéâtre antique représenté sur cette photo ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Colosseum_in_Rome,_Italy_-_April_2007.jpg?width=800
    answers:
      A: "Naples"
      B: "Milan"
      C: "Athènes"
      D: "Rome"
    correctAnswer: D
  - text: "Quel pays a pour capitale la ville où se dresse cette tour ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Tour_Eiffel_Wikimedia_Commons.jpg?width=800
