topic:
  id: topic-drapeaux-du-monde
  name: "Drapeaux du monde"
  description: "Reconnaissez les drapeaux des pays du monde, leurs couleurs et leurs symboles, et associez chaque nation à sa capitale. Un tour du globe en images pour tester votre mémoire visuelle et vos connaissances en géographie."
  category: WORLD
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_the_United_Nations.svg?width=800
questions:
  - text: "Quel pays est représenté par ce drapeau blanc à disque rouge ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Japan.svg?width=800
    answers:
      A: "Japon"
      B: "Chine"
      C: "Corée du Sud"
      D: "Viêt Nam"
    correctAnswer: A
  - text: "À quelle nation appartient ce drapeau vert à losange jaune ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Brazil.svg?width=800
    answers:
      A: "Argentine"
      B: "Portugal"
      C: "Brésil"
      D: "Colombie"
    correctAnswer: C
  - text: "Quel pays arbore ce drapeau rouge marqué d'une feuille d'érable ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Canada.svg?width=800
    answers:
      A: "Canada"
      B: "États-Unis"
      C: "Norvège"
      D: "Suisse"
    correctAnswer: A
  - text: "Ce drapeau rouge au croissant et à l'étoile blanches est celui de quel pays ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Turkey.svg?width=800
    answers:
      A: "Tunisie"
      B: "Turquie"
      C: "Algérie"
      D: "Pakistan"
    correctAnswer: B
  - text: "Quel pays ce drapeau tricolore au chakra bleu représente-t-il ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_India.svg?width=800
    answers:
      A: "Indonésie"
      B: "Irlande"
      C: "Iran"
      D: "Inde"
    correctAnswer: D
  - text: "Quel pays ce drapeau à l'Union Jack et aux étoiles du Sud représente-t-il ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Australia.svg?width=800
    answers:
      A: "Nouvelle-Zélande"
      B: "Royaume-Uni"
      C: "Australie"
      D: "Fidji"
