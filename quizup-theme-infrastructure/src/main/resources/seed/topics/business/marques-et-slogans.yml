topic:
  id: topic-marques-et-slogans
  name: "Marques & slogans"
  description: "Des slogans cultes aux grands fondateurs d'entreprises, en passant par le vocabulaire de l'économie : testez vos connaissances sur les marques et le monde du business."
  category: BUSINESS
questions:
