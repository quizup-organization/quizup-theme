    answers:
      A: "Adidas"
      B: "Reebok"
      C: "Nike"
      D: "Puma"
    correctAnswer: C
  - text: "Quelle marque de cosmétiques utilise le slogan « Parce que vous le valez bien » ?"
    answers:
      A: "L'Oréal"
      B: "Nivea"
      C: "Garnier"
      D: "Lancôme"
    correctAnswer: A
  - text: "Qui a cofondé Apple avec Steve Jobs et Ronald Wayne en 1976 ?"
    answers:
      A: "Bill Gates"
      B: "Steve Wozniak"
      C: "Jeff Bezos"
      D: "Larry Ellison"
    correctAnswer: B
  - text: "Qui a fondé Amazon en 1994 ?"
