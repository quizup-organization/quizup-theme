    en: "The Lord of the Rings"
  description: "Explorez la Terre du Milieu de J.R.R. Tolkien, des romans à la trilogie de Peter Jackson. De la Comté au Mordor, en passant par Fondcombe, la Moria, le Gouffre de Helm et Minas Tirith, suivez Frodon, Sam et la Communauté de l'Anneau face à Sauron. Questions sur les personnages, les lieux, les objets, les peuples, les batailles, les acteurs, les dates de sortie, les Oscars et la musique."
  category: MOVIES
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Hobbiton_Movie_Set%2C_Matamata.jpg?width=800
