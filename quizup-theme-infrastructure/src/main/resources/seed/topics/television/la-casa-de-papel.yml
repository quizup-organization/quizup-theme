topic:
  id: topic-la-casa-de-papel
  names:
    fr: "La Casa de Papel"
    en: "Money Heist"
  description: "Série espagnole créée par Álex Pina, La Casa de Papel suit une bande de braqueurs menée par le Professeur. Vêtus de combinaisons rouges et de masques de Dalí, ils s'emparent de la Maison de la Monnaie puis de la Banque d'Espagne. Rivalités, trahisons et sacrifices rythment ce thriller raconté par Tokyo, devenu un phénomène mondial après son passage sur Antena 3 puis Netflix."
  category: TELEVISION
  titles:
    fr:
      NOVICE: "Recrue en combinaison"
      APPRENTI: "Apprenti braqueur"
      PRATIQUANT: "Braqueur en cavale"
      CONFIRME: "Membre de la bande"
      EXPERT: "Cerveau du braquage"
      MAITRE: "Le Professeur"
      LEGENDE: "Légende de la Casa"
