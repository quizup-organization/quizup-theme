topic:
  id: topic-stranger-things
  names:
    fr: "Stranger Things"
    en: "Stranger Things"
  description: "Stranger Things est une série de science-fiction créée par les frères Duffer. Dans la petite ville de Hawkins, en Indiana, la disparition de Will Byers révèle l'existence d'une dimension parallèle, le Monde à l'envers, et d'une jeune fille aux pouvoirs étranges, Eleven. Entre monstres, laboratoire secret et nostalgie des années 1980, une bande d'amis affronte des forces qui les dépassent."
  category: TELEVISION
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Millie_Bobby_Brown_%2829895755373%29.jpg?width=800
