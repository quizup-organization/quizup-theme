topic:
  id: topic-squid-game
  names:
    fr: "Squid Game"
    en: "Squid Game"
  description: "Série sud-coréenne de survie créée par Hwang Dong-hyuk, Squid Game suit 456 joueurs endettés, dont Seong Gi-hun (joueur 456), forcés d'enchaîner des jeux d'enfance mortels sur une île isolée pour espérer remporter une fortune colossale. Diffusée sur Netflix depuis 2021, la saison 1 enchaîne dalgona, tir à la corde, billes et pont de verre ; la saison 2, sortie en 2024, ramène Gi-hun dans l'arène."
  category: TELEVISION
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Promotional_event_for_%E3%82%A4%E3%82%AB%E3%82%B2%E3%83%BC%E3%83%A0_%28Squid_Game%29_in_Shibuya.jpg?width=800
