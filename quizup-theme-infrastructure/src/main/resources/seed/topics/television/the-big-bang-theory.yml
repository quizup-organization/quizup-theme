  description: "Sitcom américaine créée par Chuck Lorre et Bill Prady, diffusée de 2007 à 2019. Elle suit Sheldon, Leonard et leurs amis, scientifiques au Caltech à Pasadena, entre expériences, comic books et répliques cultes comme le fameux « Bazinga ! ». Une série en douze saisons devenue un phénomène mondial."
