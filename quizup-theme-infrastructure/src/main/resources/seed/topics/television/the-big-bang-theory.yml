      NOVICE: "Colocataire de Sheldon"
      APPRENTI: "Doctorant du Caltech"
      PRATIQUANT: "Physicien des particules"
      CONFIRME: "Vainqueur du tournoi de Halo"
      EXPERT: "Théoricien des cordes"
      MAITRE: "Prix Nobel de physique"
      LEGENDE: "Bazinga éternel"
    en:
      NOVICE: "Sheldon's Roommate"
      APPRENTI: "Caltech Grad Student"
