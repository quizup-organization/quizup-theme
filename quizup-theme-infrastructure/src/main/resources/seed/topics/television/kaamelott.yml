topic:
  id: topic-kaamelott
  names:
    fr: "Kaamelott"
    en: "Kaamelott"
  description: "Kaamelott est une série télévisée française créée par Alexandre Astier et diffusée sur M6 de 2005 à 2009. Elle revisite la légende arthurienne sur un ton burlesque : le roi Arthur, entouré de chevaliers souvent incompétents comme Perceval, Karadoc ou Bohort, tente de mener la quête du Graal depuis son château. Six Livres, 458 épisodes et des répliques devenues cultes."
  category: TELEVISION
  titles:
    fr:
      NOVICE: "Bouseux de Carmélide"
      APPRENTI: "Chevalier de la Table Ronde"
      PRATIQUANT: "Roi de Bretagne"
      CONFIRME: "Roi d'Angleterre"
      EXPERT: "Roi de Gaule"
      MAITRE: "Roi de Bourgogne"
      LEGENDE: "Roi de Carmélide"
    en:
      NOVICE: "Peasant of Carmélide"
      APPRENTI: "Knight of the Round Table"
      PRATIQUANT: "King of Brittany"
      CONFIRME: "King of England"
      EXPERT: "King of Gaul"
      MAITRE: "King of Burgundy"
      LEGENDE: "King of Carmélide"
