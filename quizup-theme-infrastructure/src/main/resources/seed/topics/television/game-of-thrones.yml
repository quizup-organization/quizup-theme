topic:
  id: "topic-game-of-thrones"
  name: "Game of Thrones"
  description: "Plongez dans les Sept Couronnes : maisons Stark, Lannister et Targaryen, Daenerys et ses dragons, le Trône de fer, la Garde de Nuit et les grandes batailles de la série adaptée de George R. R. Martin, entre complots, dragons et marcheurs blancs."
