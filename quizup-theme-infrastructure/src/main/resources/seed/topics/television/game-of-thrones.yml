      A: "David Benioff et D. B. Weiss"
      B: "Vince Gilligan et Peter Gould"
      C: "J. J. Abrams et Damon Lindelof"
      D: "David Simon et Ed Burns"
    correctAnswer: "A"
    translations:
      en:
        text: "Who created the series Game of Thrones?"
