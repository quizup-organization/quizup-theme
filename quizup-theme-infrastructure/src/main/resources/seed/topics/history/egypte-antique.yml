      EXPERT: "Vizir du Double Pays"
      MAITRE: "Pharaon de Haute et Basse-Égypte"
      LEGENDE: "Osiris Réincarné"
    en:
      NOVICE: "Sand Scribe"
      APPRENTI: "Papyrus Bearer"
      PRATIQUANT: "Guardian of the Late Period"
      CONFIRME: "Priest of Amun"
      EXPERT: "Vizier of the Two Lands"
      MAITRE: "Pharaoh of Upper and Lower Egypt"
      LEGENDE: "Osiris Reborn"
