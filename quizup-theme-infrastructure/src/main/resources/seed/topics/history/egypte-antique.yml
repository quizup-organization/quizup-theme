topic:
  id: topic-egypte-antique
  names:
    fr: "Égypte antique"
    en: "Ancient Egypt"
  description: "De l'unification de Narmer à la chute des Ptolémées, parcourez trois millénaires d'histoire le long du Nil : grandes périodes, pharaons légendaires, pyramides et Sphinx, capitales royales, couronnes et symboles du pouvoir."
  category: HISTORY
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Great_Sphinx_of_Giza_%282%29.jpg?width=800
questions:
  - text: "Qui est traditionnellement considéré comme le premier pharaon à avoir unifié la Haute et la Basse-Égypte ?"
    answers:
      A: "Narmer"
      B: "Djoser"
      C: "Snéfrou"
      D: "Khéops"
    correctAnswer: A
    translations:
      en:
        text: "Who is traditionally considered the first pharaoh to have unified Upper and Lower Egypt?"
        answers:
          A: "Narmer"
          B: "Djoser"
          C: "Sneferu"
          D: "Khufu"
  - text: "Sur quel site la palette de Narmer a-t-elle été découverte ?"
