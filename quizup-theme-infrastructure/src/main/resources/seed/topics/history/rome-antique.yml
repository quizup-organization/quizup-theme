topic:
  id: topic-rome-antique
  names:
    fr: "Rome antique"
    en: "Ancient Rome"
  description: "De la fondation légendaire de 753 av. J.-C. à la chute de l'Empire d'Occident, ce thème retrace l'histoire de Rome : la louve et Romulus, les sept rois, la République et ses institutions, les grandes conquêtes, Jules César, les empereurs célèbres et les tournants majeurs de la civilisation romaine."
  category: HISTORY
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Colosseum_of_Rome%2C_Italy.jpg?width=800
questions:
  - text: "Selon la tradition, en quelle année Rome a-t-elle été fondée ?"
    answers:
      A: "753 av. J.-C."
      B: "509 av. J.-C."
      C: "476 ap. J.-C."
      D: "44 av. J.-C."
    correctAnswer: A
    translations:
      en:
        text: "According to tradition, in what year was Rome founded?"
        answers:
          A: "753 BC"
          B: "509 BC"
          C: "476 AD"
          D: "44 BC"
  - text: "Quels jumeaux légendaires sont à l'origine de Rome ?"
    answers:
