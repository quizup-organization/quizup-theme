topic:
  id: topic-mythologie-grecque
  names:
    fr: "Mythologie grecque"
    en: "Greek Mythology"
  description: "Panorama de la mythologie grecque : les divinités de l'Olympe, les Titans et les récits de création et de succession, du Chaos à la victoire de Zeus. Sont aussi abordés les attributs des dieux, le mont Olympe, les Enfers et le Tartare, les héros divinisés et les textes fondateurs d'Hésiode et d'Homère."
  category: HISTORY
  titles:
    fr:
      NOVICE: "Berger du mont Ida"
      APPRENTI: "Porteur d'ambroisie"
      PRATIQUANT: "Initié des Mystères"
      CONFIRME: "Vainqueur de la Chimère"
      EXPERT: "Arbitre du jugement de Pâris"
      MAITRE: "Échanson de l'Olympe"
      LEGENDE: "Souverain du Chaos"
    en:
      NOVICE: "Shepherd of Mount Ida"
      APPRENTI: "Ambrosia Bearer"
      PRATIQUANT: "Initiate of the Mysteries"
      CONFIRME: "Chimera Slayer"
      EXPERT: "Judge of the Judgment of Paris"
      MAITRE: "Cupbearer of Olympus"
      LEGENDE: "Sovereign of Chaos"
  imageUrl: wikipedia/history/Jacob_van_der_Ulft_-_The_Phidian_statue_of_Zeus_at_Olympia,_with_olympic_games_taking_place_at_its_feet,_l19038-b3tws-1.jpg
questions:
  - text: "Selon Hésiode, quelle divinité primordiale émerge en premier après le Chaos ?"
    answers:
      A: "Gaia (la Terre)"
      B: "Éros (l'Amour)"
      C: "Tartare"
      D: "Ouranos (le Ciel)"
    correctAnswer: A
    translations:
      en:
        text: "According to Hesiod, which primordial deity emerges first after Chaos?"
        answers:
          A: "Gaia (Earth)"
          B: "Eros (Love)"
          C: "Tartarus"
          D: "Uranus (Sky)"
    difficulty: MEDIUM
  - text: "Quel Titan, frère de Cronos, personnifie le fleuve Océan qui entoure le monde ?"
