        answers:
          A: "1943"
          B: "1945"
          C: "1944"
          D: "1946"
  - text: "Quel roi de France a été surnommé Saint Louis ?"
    answers:
      A: "Louis IX"
      B: "Louis VII"
      C: "Philippe II Auguste"
      D: "Charles V"
    correctAnswer: A
    translations:
      en:
        text: "Which king of France was nicknamed Saint Louis?"
        answers:
          A: "Louis IX"
          B: "Louis VII"
          C: "Philip II Augustus"
          D: "Charles V"
  - text: "Quelle loi de 1905 a établi la séparation des Églises et de l'État en France ?"
    answers:
      A: "La loi sur la liberté de la presse"
      B: "La loi de séparation des Églises et de l'État"
      C: "La loi Jules Ferry"
      D: "La loi sur les associations"
    correctAnswer: B
    translations:
      en:
        text: "Which 1905 law established the separation of Church and State in France?"
        answers:
          A: "The law on freedom of the press"
