topic:
  id: topic-grandes-dates
  name: "Grandes dates"
  description: "Des grandes dates qui ont marqué l'histoire du monde, de l'Antiquité à l'ère spatiale : la chute de Constantinople, la prise de la Bastille, la Déclaration d'indépendance des États-Unis, la Première Guerre mondiale ou encore les premiers pas sur la Lune."
  category: HISTORY
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/The_Earth_seen_from_Apollo_17.jpg?width=800
questions:
  - text: "Qui a mis au point l'imprimerie à caractères mobiles en Europe vers 1450 ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Gutenberg.jpg?width=800
    answers:
      A: "Léonard de Vinci"
      B: "Johannes Gutenberg"
      C: "Nicolas Copernic"
      D: "Galilée"
    correctAnswer: B
  - text: "Quel navigateur a lancé en 1519 la première expédition qui a fait le tour du monde ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Ferdinand_Magellan.jpg?width=800
    answers:
      A: "Fernand de Magellan"
      B: "Christophe Colomb"
      C: "Vasco de Gama"
      D: "Francis Drake"
    correctAnswer: A
  - text: "Quel texte fondateur a été adopté par le Congrès américain le 4 juillet 1776 ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Declaration_of_Independence_(1819),_by_John_Trumbull.jpg?width=800
    answers:
      A: "La Constitution américaine"
      B: "Le Bill of Rights"
      C: "Le traité de Paris"
      D: "La Déclaration d'indépendance des États-Unis"
    correctAnswer: D
  - text: "Quel événement du 14 juillet 1789 marque le début de la Révolution française ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Prise_de_la_Bastille.jpg?width=800
    answers:
      A: "Le sacre de Napoléon"
      B: "La Fête de la Fédération"
      C: "La prise de la Bastille"
      D: "Le serment du Jeu de paume"
    correctAnswer: C
  - text: "Quel paquebot britannique a sombré dans l'Atlantique après avoir heurté un iceberg en 1912 ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/RMS_Titanic_3.jpg?width=800
    answers:
      A: "Le Titanic"
      B: "Le Lusitania"
      C: "Le Britannic"
      D: "Le Carpathia"
    correctAnswer: A
  - text: "Quel astronaute de la mission Apollo 11 est photographié ici sur la Lune en 1969 ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Aldrin_Apollo_11.jpg?width=800
    answers:
      A: "Neil Armstrong"
      B: "Michael Collins"
      C: "Buzz Aldrin"
      D: "Youri Gagarine"
    correctAnswer: C
  - text: "En quelle année l'Empire romain d'Occident s'effondre-t-il avec la déposition de Romulus Augustule ?"
    answers:
      A: "395"
      B: "476"
      C: "800"
      D: "1453"
    correctAnswer: B
  - text: "Quelle bataille de 732 Charles Martel a-t-il remportée contre les Omeyyades ?"
    answers:
      A: "La bataille de Marignan"
      B: "La bataille de Bouvines"
      C: "La bataille d'Hastings"
      D: "La bataille de Poitiers"
    correctAnswer: D
  - text: "En quelle année Constantinople tombe-t-elle aux mains des Ottomans ?"
    answers:
      A: "1204"
      B: "1450"
      C: "1453"
      D: "1492"
    correctAnswer: C
  - text: "Quel navigateur génois atteint l'Amérique en 1492 pour le compte de l'Espagne ?"
    answers:
      A: "Christophe Colomb"
      B: "Vasco de Gama"
      C: "James Cook"
      D: "Amerigo Vespucci"
    correctAnswer: A
  - text: "En quelle année Martin Luther publie-t-il ses 95 thèses ?"
    answers:
      A: "1453"
      B: "1492"
      C: "1515"
      D: "1517"
    correctAnswer: D
  - text: "Quel attentat de juin 1914 a servi de prétexte au déclenchement de la Première Guerre mondiale ?"
    answers:
      A: "L'attentat de Munich"
      B: "L'attentat de Sarajevo"
      C: "L'incendie du Reichstag"
      D: "L'affaire Dreyfus"
    correctAnswer: B
  - text: "En quelle année l'armistice met-il fin à la Première Guerre mondiale ?"
    answers:
      A: "1918"
      B: "1917"
      C: "1919"
      D: "1920"
    correctAnswer: A
  - text: "Quelle pandémie a fait des millions de morts entre 1918 et 1919 ?"
    answers:
      A: "La peste noire"
      B: "Le choléra"
      C: "La variole"
      D: "La grippe espagnole"
    correctAnswer: D
  - text: "En quelle année la Seconde Guerre mondiale a-t-elle débuté en Europe ?"
    answers:
      A: "1938"
      B: "1939"
      C: "1940"
      D: "1941"
    correctAnswer: B
  - text: "Quelle organisation internationale a été fondée en 1945 pour maintenir la paix ?"
    answers:
      A: "La Société des Nations"
      B: "L'UNESCO"
      C: "L'Organisation des Nations unies"
      D: "Le Conseil de l'Europe"
    correctAnswer: C
  - text: "Quelle ville japonaise a été frappée par la première bombe atomique le 6 août 1945 ?"
    answers:
      A: "Tokyo"
      B: "Nagasaki"
      C: "Osaka"
      D: "Hiroshima"
    correctAnswer: D
  - text: "Quel président américain a été assassiné à Dallas en 1963 ?"
    answers:
      A: "John F. Kennedy"
      B: "Franklin D. Roosevelt"
      C: "Harry S. Truman"
      D: "Richard Nixon"
    correctAnswer: A
  - text: "En quelle année le mur de Berlin est-il tombé ?"
    answers:
      A: "1968"
      B: "1979"
      C: "1989"
      D: "1991"
    correctAnswer: C
  - text: "En quelle année Nelson Mandela est-il devenu président de l'Afrique du Sud ?"
    answers:
      A: "1990"
      B: "1994"
      C: "1996"
      D: "1999"
    correctAnswer: B
