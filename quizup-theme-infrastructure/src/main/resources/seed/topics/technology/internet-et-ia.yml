topic:
  id: topic-internet-et-ia
  names:
    fr: "Internet & intelligence artificielle"
    en: "Internet & Artificial Intelligence"
  description: "Des origines d'ARPANET au World Wide Web de Tim Berners-Lee, des moteurs de recherche aux adresses IP et au DNS, ce thème retrace l'histoire d'Internet. Il explore aussi l'intelligence artificielle, d'Alan Turing et de son test aux réseaux de neurones, au machine learning et à l'IA générative. Testez vos connaissances sur les grandes étapes, les concepts clés et les pionniers du numérique."
  category: TECHNOLOGY
  imageUrl: wikipedia/technology/BalticServers_data_center.jpg
