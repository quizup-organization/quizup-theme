topic:
  id: topic-informatique
  name: "Informatique"
  description: "De la machine de Turing à Internet : histoire de l'informatique, composants, langages de programmation et algorithmes expliqués simplement."
  category: TECHNOLOGY
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Ada_Lovelace_portrait.jpg?width=800
questions:
  - text: "Quel mathématicien britannique est considéré comme le père de l'informatique ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Alan_Turing_Aged_16.jpg?width=800
    answers:
      A: "Alan Turing"
      B: "Charles Babbage"
      C: "John von Neumann"
      D: "Blaise Pascal"
    correctAnswer: A
  - text: "Qui a écrit le premier programme destiné à une machine au XIXe siècle ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Ada_Lovelace_portrait.jpg?width=800
    answers:
      A: "Grace Hopper"
      B: "Ada Lovelace"
      C: "Hedy Lamarr"
      D: "Marie Curie"
    correctAnswer: B
  - text: "Que signifie le sigle CPU ?"
    answers:
      A: "Computer Power Unit"
