    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Alan_Turing_Aged_16.jpg?width=800
    answers:
      A: "Alan Turing"
      B: "Charles Babbage"
      C: "John von Neumann"
      D: "Blaise Pascal"
    correctAnswer: A
    translations:
      en:
        text: "Which British mathematician is considered the father of computer science?"
        answers:
          A: "Alan Turing"
          B: "Charles Babbage"
          C: "John von Neumann"
          D: "Blaise Pascal"
