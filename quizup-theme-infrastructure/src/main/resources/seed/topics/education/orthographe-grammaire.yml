topic:
  id: topic-orthographe-grammaire
  names:
    fr: "Orthographe"
    en: "Spelling & Grammar"
  description: "Accords, homophones, conjugaison, pluriels et participes passés : un thème pour vérifier que les règles du français n'ont plus de secrets pour vous."
  category: EDUCATION
questions:
  - text: "Quelle est l'orthographe correcte ?"
    answers:
      A: "développement"
      B: "dévellopement"
      C: "développemment"
      D: "dévelloppement"
    correctAnswer: A
  - text: "Complétez : « Il ... à la plage chaque matin. »"
    answers:
      A: "vas"
      B: "va"
      C: "vat"
      D: "vait"
    correctAnswer: B
  - text: "Quel est le pluriel du nom « cheval » ?"
    answers:
      A: "chevals"
      B: "chevaus"
      C: "chevaux"
      D: "cheveaux"
    correctAnswer: C
  - text: "Complétez : « Ils ... partis très tôt. »"
    answers:
      A: "son"
      B: "sons"
      C: "sont-ils"
      D: "sont"
    correctAnswer: D
  - text: "Complétez : « Il ... acheté du pain ... la boulangerie. »"
    answers:
      A: "a / à"
      B: "à / a"
      C: "a / a"
      D: "à / à"
    correctAnswer: A
  - text: "Accordez le participe passé : « Les lettres que j'ai ... » (écrire)"
    answers:
      A: "écrit"
      B: "écrite"
      C: "écrites"
      D: "écrits"
    correctAnswer: C
  - text: "Quelle suite de formes du verbe être au présent est correcte ?"
    answers:
      A: "je suit, tu es, il est"
      B: "je suis, tu es, il ait"
      C: "je suis, tu es, il est"
      D: "je suis, tu est, il est"
    correctAnswer: C
  - text: "Accordez l'adjectif : « des femmes ... » (content)"
    answers:
      A: "content"
      B: "contents"
      C: "contente"
      D: "contentes"
    correctAnswer: D
  - text: "Accordez le participe passé : « Les fleurs que j'ai ... » (cueillir)"
    answers:
      A: "cueilli"
      B: "cueillies"
      C: "cueillis"
      D: "cueillie"
    correctAnswer: B
  - text: "Complétez : « ... vas-tu passer tes vacances ? »"
    answers:
      A: "Ou"
      B: "Où"
      C: "Oux"
      D: "Oùx"
    correctAnswer: B
  - text: "Quel est le féminin du nom « acteur » ?"
    answers:
      A: "actrice"
      B: "acteure"
      C: "acteuse"
      D: "acteuresse"
    correctAnswer: A
  - text: "Complétez : « Nous ... nos devoirs avant de sortir. » (finir)"
    answers:
      A: "finons"
      B: "finisons"
      C: "finissons"
      D: "finnissons"
    correctAnswer: C
  - text: "Quelle est la forme correcte du verbe être au passé simple, à la troisième personne du singulier ?"
    answers:
      A: "fût"
      B: "était"
      C: "sera"
      D: "fut"
    correctAnswer: D
  - text: "Quel mot est un synonyme de « joyeux » ?"
    answers:
      A: "triste"
      B: "content"
      C: "fatigué"
      D: "inquiet"
    correctAnswer: B
  - text: "Quel est le pluriel du nom « bijou » ?"
    answers:
      A: "bijous"
      B: "bijouxs"
      C: "bijoux"
      D: "bijouxes"
    correctAnswer: C
  - text: "Complétez : « ... ici que je travaille. »"
    answers:
      A: "Ses"
      B: "C'est"
      C: "S'est"
      D: "Ces"
    correctAnswer: B
  - text: "Complétez : « C'est moi qui ... raison. »"
    answers:
      A: "ai"
      B: "a"
      C: "as"
      D: "aie"
    correctAnswer: A
  - text: "Comment s'écrit correctement le mot qui signifie « en dépit de » ?"
    answers:
      A: "malgrés"
      B: "malgré"
      C: "malgrè"
      D: "malsgré"
    correctAnswer: B
  - text: "Quelle phrase est correctement écrite ?"
    answers:
      A: "Je leurs ai parlé."
      B: "Je leurs ai parlés."
      C: "Je leur ai parlé."
      D: "Je leur ai parlés."
    correctAnswer: C
  - text: "Complétez : « Il ... parti très tôt ce matin. »"
    answers:
      A: "et"
      B: "es"
      C: "ai"
      D: "est"
    correctAnswer: D
