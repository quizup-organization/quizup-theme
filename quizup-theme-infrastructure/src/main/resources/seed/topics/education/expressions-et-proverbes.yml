topic:
  id: topic-expressions-et-proverbes
  names:
    fr: "Expressions & proverbes"
    en: "French Idioms & Proverbs"
  description: "Les proverbes et expressions de la langue française transmettent une sagesse populaire héritée des siècles. Ce thème vous invite à redécouvrir le sens des proverbes classiques, l'origine biblique ou latine de certaines formules, ainsi que les moralistes et fabulistes qui les ont illustrés, d'Ésope à Jean de La Fontaine. Bonne découverte de la richesse des dictons français !"
  category: EDUCATION
  titles:
    fr:
      NOVICE: "Perroquet Bavard"
      APPRENTI: "Écho du Village"
      PRATIQUANT: "Conteur du Dimanche"
      CONFIRME: "Fine Plume"
      EXPERT: "Oracle des Proverbes"
      MAITRE: "Fontaine de Sagesse"
      LEGENDE: "Bouche d'Or"
    en:
      NOVICE: "Chatty Parrot"
      APPRENTI: "Village Echo"
      PRATIQUANT: "Sunday Storyteller"
      CONFIRME: "Sharp Quill"
      EXPERT: "Proverb Oracle"
      MAITRE: "Fountain of Wisdom"
      LEGENDE: "Golden Tongue"
