questions:
  - text: "Quel proverbe français signifie que des petits avantages successifs valent mieux qu'un gain important mais incertain ?"
    answers:
      A: "Petit à petit, l'oiseau fait son nid"
      B: "Un tiens vaut mieux que deux tu l'auras"
      C: "Mieux vaut tard que jamais"
      D: "L'habit ne fait pas le moine"
    correctAnswer: A
    translations:
      en:
        text: "Which French proverb means that small successive advantages are worth more than a large but uncertain gain?"
        answers:
          A: "Little by little, the bird builds its nest"
          B: "A bird in the hand is worth two in the bush"
          C: "Better late than never"
          D: "The habit does not make the monk"
    difficulty: HARD
