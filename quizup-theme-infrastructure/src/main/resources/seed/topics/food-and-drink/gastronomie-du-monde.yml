topic:
  id: topic-gastronomie-du-monde
  name: "Gastronomie du monde"
  description: "Un tour du monde gourmand : plats emblématiques, spécialités régionales françaises, fromages et épices. De la paella valenciana au sushi japonais, du couscous marocain au bœuf bourguignon, découvrez les origines et les ingrédients des grandes cuisines du globe."
  category: FOOD_AND_DRINK
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Paella_valenciana.jpg?width=800
questions:
  - text: "Quel plat espagnol à base de riz safrané, originaire de la région de Valence, est photographié ici ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Paella_de_marisco.jpg?width=800
    answers:
      A: "Le risotto"
      B: "Le couscous"
      C: "La paella"
      D: "Le pa amb tomàquet"
    correctAnswer: C
  - text: "Quel est ce plat japonais composé de riz vinaigré accompagné de poisson ou de fruits de mer ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Sushi_platter.jpg?width=800
    answers:
      A: "Le sushi"
      B: "Le ramen"
      C: "Le pad thaï"
      D: "Le dim sum"
    correctAnswer: A
  - text: "Quelle pizza italienne est garnie de tomate, de mozzarella et de basilic ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Pizza_Margherita.jpg?width=800
    answers:
      A: "La pizza quatre fromages"
      B: "La pizza au pepperoni"
      C: "La pizza reine"
      D: "La pizza margherita"
    correctAnswer: D
  - text: "Quel plat d'Afrique du Nord est composé de semoule, de légumes et de viande ou de poisson ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Couscous.jpg?width=800
    answers:
      A: "Le tajine"
      B: "Le couscous"
      C: "La pastilla"
      D: "La chakchouka"
    correctAnswer: B
  - text: "Quel plat grec est un gratin d'aubergines et de viande hachée nappé de béchamel ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Moussaka.jpg?width=800
    answers:
      A: "Les dolmades"
      B: "Le souvlaki"
      C: "La moussaka"
      D: "Le tzatziki"
    correctAnswer: C
  - text: "Quelle soupe d'Europe de l'Est doit sa couleur rouge à la betterave ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Borscht.jpg?width=800
    answers:
      A: "Le bortsch"
      B: "La soupe à l'oignon"
      C: "Le minestrone"
      D: "Le gaspacho"
    correctAnswer: A
  - text: "Le cassoulet, spécialité à base de haricots blancs et de viande, est originaire de quelle région française ?"
    answers:
      A: "La Bretagne"
      B: "L'Alsace"
      C: "La Provence"
      D: "Le Languedoc"
