  - text: "Quel plat bourguignon est un bœuf mijoté au vin rouge avec des lardons et des champignons ?"
    answers:
      A: "La choucroute"
      B: "Le bœuf bourguignon"
      C: "La blanquette de veau"
      D: "Le coq au vin"
    correctAnswer: B
  - text: "Quelle spécialité alsacienne est composée de chou fermenté servi avec de la charcuterie et des pommes de terre ?"
    answers:
      A: "La choucroute"
      B: "La ratatouille"
      C: "La quiche lorraine"
      D: "Le gratin dauphinois"
