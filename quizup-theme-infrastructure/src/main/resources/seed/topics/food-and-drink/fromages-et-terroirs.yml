topic:
  id: topic-fromages-et-terroirs
  names:
    fr: "Fromages & terroirs"
    en: "Cheeses & Local Products"
  description: "Des fromages emblématiques aux terroirs qui les ont vus naître : camembert de Normandie, brie de Meaux, roquefort, comté, chèvres du Berry, munster, reblochon ou tomme de Savoie. Un parcours entre laits de vache, de brebis et de chèvre, savoir-faire de fabrication, affinage et appellations AOP/IGP. Testez vos connaissances sur les régions, les formes et les secrets des fromages français."
  category: FOOD_AND_DRINK
  titles:
    fr:
      NOVICE: "Croûte Fleurie"
      APPRENTI: "P'tit Affineur"
      PRATIQUANT: "Tâteur de Meules"
      CONFIRME: "Brebis Éclairée"
      EXPERT: "Maître Affineur"
      MAITRE: "Grand Fromager"
      LEGENDE: "Pape du Roquefort"
    en:
      NOVICE: "Soft Rind Rookie"
      APPRENTI: "Little Ager"
      PRATIQUANT: "Wheel Tapper"
      CONFIRME: "Ewe-phoric"
      EXPERT: "Master Ager"
      MAITRE: "Grand Cheesemonger"
      LEGENDE: "Roquefort Royalty"
