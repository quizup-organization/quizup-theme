        text: "Which fruit traditionally fills the Limousin clafoutis?"
        answers:
          A: "Apple"
          B: "Apricot"
          C: "Plum"
          D: "Cherry"
  - text: "Quelle plante produit les gousses qui parfument la crème anglaise et la crème brûlée ?"
