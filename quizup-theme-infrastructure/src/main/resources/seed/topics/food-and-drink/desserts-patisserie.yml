        text: "In which French region was kouign-amann, made with leavened dough, butter and sugar, born?"
        answers:
          A: "Brittany"
          B: "Normandy"
          C: "Alsace"
          D: "Périgord"
  - text: "De quel pays le pastel de nata, flan pâtissier à la crème, est-il originaire ?"
    answers:
      A: "L'Espagne"
      B: "Le Brésil"
      C: "Le Portugal"
      D: "Le Maroc"
    correctAnswer: C
    translations:
      en:
        text: "Which country does pastel de nata, a custard pastry, originate from?"
        answers:
          A: "Spain"
          B: "Brazil"
          C: "Portugal"
          D: "Morocco"
  - text: "Quel fruit garnit traditionnellement le clafoutis limousin ?"
    answers:
      A: "La pomme"
      B: "L'abricot"
      C: "La prune"
      D: "La cerise"
    correctAnswer: D
