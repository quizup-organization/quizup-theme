topic:
  id: topic-tennis
  names:
    fr: "Tennis"
    en: "Tennis"
  description: "Le tennis est un sport de raquette qui oppose deux joueurs en simple ou quatre en double, sur un court divisé par un filet. Il se pratique sur gazon, terre battue ou surface dure, et se joue en sets, jeux et points, avec des règles comme le tie-break et l'avantage. Les quatre tournois du Grand Chelem — Open d'Australie, Roland-Garros, Wimbledon et US Open — sont les plus prestigieux."
  category: SPORTS
  titles:
    fr:
      NOVICE: "Ramasseur de balles"
      APPRENTI: "Joueur du dimanche"
      PRATIQUANT: "Classé 30/5"
      CONFIRME: "Qualifié en Grand Chelem"
      EXPERT: "Tête de série"
      MAITRE: "Vainqueur en Grand Chelem"
      LEGENDE: "Légende du tennis"
    en:
