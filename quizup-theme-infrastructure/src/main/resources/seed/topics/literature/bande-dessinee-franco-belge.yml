topic:
  id: topic-bande-dessinee-franco-belge
  names:
    fr: "Bande dessinée franco-belge"
    en: "Franco-Belgian Comics"
  description: "La bande dessinée franco-belge, née en Belgique et en France au XXe siècle, a donné naissance à des héros mondialement célèbres : Tintin, Astérix, Lucky Luke, Spirou, Blake et Mortimer ou encore Gaston Lagaffe. Ce thème couvre les grandes séries, leurs créateurs (Hergé, Goscinny, Uderzo, Morris, Franquin, Jacobs), les personnages cultes et les albums mythiques du neuvième art."
  category: LITERATURE
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Comic_wall_Asterix_%26_Obelix%2C_Goscinny_and_Uderzo._Brussels.jpg?width=800
