topic:
  id: topic-livres-et-mythes
  name: "Livres & mythes"
  description: "Des grandes œuvres de la littérature mondiale aux légendes de la mythologie grecque, romaine et nordique : auteurs, héros et créatures fabuleuses."
  category: LITERATURE
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg?width=800
questions:
  - text: "Qui a écrit la tragédie Roméo et Juliette ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Shakespeare.jpg?width=800
    answers:
      A: "Molière"
      B: "William Shakespeare"
      C: "Christopher Marlowe"
      D: "Jean Racine"
    correctAnswer: B
  - text: "Qui a écrit le roman Don Quichotte ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Miguel_de_Cervantes_2.jpg?width=800
    answers:
      A: "Lope de Vega"
      B: "Federico García Lorca"
      C: "Pablo Neruda"
      D: "Miguel de Cervantès"
    correctAnswer: D
  - text: "Quel poète de la Grèce antique est traditionnellement considéré comme l'auteur de l'Odyssée ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Homer_British_Museum.jpg?width=800
    answers:
      A: "Homère"
      B: "Sophocle"
      C: "Euripide"
      D: "Hésiode"
    correctAnswer: A
  - text: "Qui a peint ce tableau représentant la naissance de Vénus ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg?width=800
    answers:
      A: "Raphaël"
      B: "Michel-Ange"
      C: "Sandro Botticelli"
      D: "Le Titien"
    correctAnswer: C
  - text: "Dans la mythologie nordique, quel dieu brandit le marteau Mjöllnir ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Mårten_Eskil_Winge_-_Tor's_Fight_with_the_Giants_-_Google_Art_Project.jpg?width=800
    answers:
      A: "Odin"
      B: "Thor"
      C: "Loki"
      D: "Freyr"
    correctAnswer: B
  - text: "Qui a écrit Les Misérables ?"
    answers:
      A: "Émile Zola"
      B: "Honoré de Balzac"
      C: "Gustave Flaubert"
      D: "Victor Hugo"
