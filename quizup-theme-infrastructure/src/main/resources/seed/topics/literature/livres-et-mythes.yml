      B: "Méduse"
      C: "L'Hydre de Lerne"
      D: "Circé"
    correctAnswer: B
  - text: "Qui a écrit Vingt Mille Lieues sous les mers ?"
    answers:
      A: "Alexandre Dumas"
      B: "Victor Hugo"
      C: "Émile Zola"
      D: "Jules Verne"
    correctAnswer: D
  - text: "Dans la mythologie grecque, quel dieu règne sur les mers ?"
    answers:
      A: "Poséidon"
      B: "Zeus"
      C: "Hadès"
      D: "Triton"
    correctAnswer: A
  - text: "Quelle déesse grecque est associée à la sagesse et à la guerre ?"
    answers:
      A: "Héra"
      B: "Aphrodite"
      C: "Athéna"
      D: "Artémis"
    correctAnswer: C
