    en: "Dinosaurs"
  description: "Les dinosaures ont régné sur la Terre pendant l'ère mésozoïque, du Trias au Crétacé. Découvre les grandes familles de théropodes, sauropodes et cératopsiens, les espèces iconiques comme le Tyrannosaurus rex ou le Triceratops, les périodes géologiques, l'extinction de la fin du Crétacé et le travail des paléontologues sur les fossiles."
  category: NATURE
  titles:
    fr:
      NOVICE: "Caillou qui gratte"
      APPRENTI: "Fouilleur de sable"
      PRATIQUANT: "Dénicheur d'os"
