      EXPERT: "Chasseur de fossiles"
      MAITRE: "Seigneur du Crétacé"
      LEGENDE: "Mémoire du Mésozoïque"
    en:
      NOVICE: "Rock Scratcher"
      APPRENTI: "Sand Digger"
      PRATIQUANT: "Bone Finder"
      CONFIRME: "Skeleton Builder"
      EXPERT: "Fossil Hunter"
      MAITRE: "Cretaceous Overlord"
      LEGENDE: "Mesozoic Memory"
