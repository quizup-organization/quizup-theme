topic:
  id: topic-animaux-du-monde
  name: "Animaux du monde"
  description: "Partez à la rencontre de la faune mondiale : identification des espèces, records du règne animal, habitats et classification."
  category: NATURE
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/African_Bush_Elephant.jpg?width=800
questions:
  - text: "Quel est cet animal au long nez préhensile ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/African_Bush_Elephant.jpg?width=800
    answers:
      A: "L'hippopotame"
      B: "Le rhinocéros"
      C: "L'éléphant d'Afrique"
      D: "Le buffle"
    correctAnswer: C
  - text: "Quel est le plus grand animal de tous les temps ?"
    answers:
      A: "Le diplodocus"
      B: "Le cachalot"
      C: "L'éléphant d'Afrique"
      D: "La baleine bleue"
    correctAnswer: D
  - text: "Quel est cet animal au très long cou ?"
