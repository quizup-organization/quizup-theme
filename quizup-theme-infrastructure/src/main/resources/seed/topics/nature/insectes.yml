topic:
  id: topic-insectes
  names:
    fr: "Insectes & petites bêtes"
    en: "Insects & Bugs"
  description: "Plongez dans l'univers fascinant des insectes et des petites bêtes qui peuplent nos jardins, nos maisons et nos forêts. Abeilles, fourmis, papillons, coccinelles, libellules, moustiques, araignées, scorpions et mille-pattes n'auront plus de secrets pour vous. Explorez la métamorphose, les rôles écologiques et les records surprenants de ces créatures indispensables à la biodiversité."
  category: NATURE
  imageUrl: wikipedia/nature/Adalia_bipunctata_(2007-04-08).jpg
