topic:
  id: topic-insectes
  names:
    fr: "Insectes & petites bêtes"
    en: "Insects & Bugs"
  description: "Plongez dans l'univers fascinant des insectes et des petites bêtes qui peuplent nos jardins, nos maisons et nos forêts. Abeilles, fourmis, papillons, coccinelles, libellules, moustiques, araignées, scorpions et mille-pattes n'auront plus de secrets pour vous. Explorez la métamorphose, les rôles écologiques et les records surprenants de ces créatures indispensables à la biodiversité."
  category: NATURE
  titles:
    fr:
      NOVICE: "Chasseur de moustiques"
      APPRENTI: "Éleveur de fourmis"
      PRATIQUANT: "Observateur de coccinelles"
      CONFIRME: "Guide de la métamorphose"
      EXPERT: "Maître des essaims"
      MAITRE: "Gardien de la ruche"
      LEGENDE: "Roi des insectes"
    en:
      NOVICE: "Mosquito Swatter"
      APPRENTI: "Ant Farmer"
      PRATIQUANT: "Ladybug Watcher"
      CONFIRME: "Metamorphosis Guide"
      EXPERT: "Swarm Master"
      MAITRE: "Hive Guardian"
      LEGENDE: "Insect King"
