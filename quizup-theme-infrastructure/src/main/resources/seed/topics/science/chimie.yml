topic:
  id: topic-chimie
  names:
    fr: "Chimie"
    en: "Chemistry"
  description: "Des atomes aux réactions : découvrez les éléments, le tableau périodique, les états de la matière et les grands scientifiques de la chimie."
  category: SCIENCE
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Dmitri_Mendeleev_1890s.jpg?width=800
questions:
  - text: "Quelle est la formule chimique de l'eau ?"
    answers:
      A: "H2O"
      B: "CO2"
      C: "O2"
      D: "NaCl"
    correctAnswer: A
    translations:
      en:
        text: "What is the chemical formula for water?"
        answers:
          A: "H2O"
          B: "CO2"
          C: "O2"
          D: "NaCl"
  - text: "Quel est le symbole chimique du fer ?"
    answers:
      A: "Fe"
      B: "F"
      C: "Ir"
      D: "Fr"
    correctAnswer: A
    translations:
      en:
        text: "What is the chemical symbol for iron?"
        answers:
          A: "Fe"
          B: "F"
          C: "Ir"
          D: "Fr"
  - text: "Quel est le symbole chimique de l'or ?"
    answers:
      A: "Ag"
      B: "Au"
      C: "Or"
      D: "Oz"
    correctAnswer: B
    translations:
      en:
        text: "What is the chemical symbol for gold?"
        answers:
          A: "Ag"
          B: "Au"
          C: "Or"
          D: "Oz"
  - text: "Combien d'éléments chimiques compte aujourd'hui le tableau périodique ?"
    answers:
      A: "92"
      B: "118"
      C: "100"
      D: "127"
    correctAnswer: B
    translations:
      en:
        text: "How many chemical elements are in the periodic table today?"
        answers:
          A: "92"
          B: "118"
          C: "100"
          D: "127"
  - text: "Quel scientifique a proposé le tableau périodique des éléments ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Dmitri_Mendeleev_1890s.jpg?width=800
    answers:
      A: "Ernest Rutherford"
      B: "Antoine Lavoisier"
      C: "John Dalton"
      D: "Dmitri Mendeleïev"
    correctAnswer: D
    translations:
      en:
        text: "Which scientist proposed the periodic table of elements?"
        answers:
          A: "Ernest Rutherford"
          B: "Antoine Lavoisier"
          C: "John Dalton"
          D: "Dmitri Mendeleev"
  - text: "Quelle scientifique a reçu deux prix Nobel, en physique puis en chimie ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Marie_Curie_c._1920s.jpg?width=800
    answers:
      A: "Rosalind Franklin"
      B: "Lise Meitner"
      C: "Marie Curie"
      D: "Irène Joliot-Curie"
    correctAnswer: C
    translations:
      en:
        text: "Which scientist won two Nobel Prizes, in physics and then in chemistry?"
        answers:
          A: "Rosalind Franklin"
          B: "Lise Meitner"
          C: "Marie Curie"
          D: "Irène Joliot-Curie"
  - text: "Quel est le symbole chimique du sodium ?"
    answers:
      A: "So"
      B: "Sn"
      C: "Sd"
      D: "Na"
    correctAnswer: D
    translations:
      en:
        text: "What is the chemical symbol for sodium?"
        answers:
          A: "So"
          B: "Sn"
          C: "Sd"
          D: "Na"
  - text: "Quel est le symbole chimique de l'oxygène ?"
    answers:
      A: "Og"
      B: "Ox"
      C: "O"
      D: "Om"
    correctAnswer: C
    translations:
      en:
        text: "What is the chemical symbol for oxygen?"
        answers:
          A: "Og"
          B: "Ox"
          C: "O"
          D: "Om"
  - text: "Quels sont les trois états physiques usuels de la matière ?"
    answers:
      A: "Solide, liquide et gazeux"
      B: "Dur, mou et fluide"
      C: "Froid, tiède et chaud"
      D: "Acide, neutre et basique"
    correctAnswer: A
    translations:
      en:
        text: "What are the three common physical states of matter?"
        answers:
          A: "Solid, liquid, and gas"
          B: "Hard, soft, and fluid"
          C: "Cold, warm, and hot"
          D: "Acidic, neutral, and basic"
  - text: "Quel gaz les plantes absorbent-elles pour la photosynthèse ?"
    answers:
      A: "L'oxygène"
      B: "L'hydrogène"
      C: "L'azote"
      D: "Le dioxyde de carbone"
    correctAnswer: D
    translations:
      en:
        text: "Which gas do plants absorb for photosynthesis?"
        answers:
          A: "Oxygen"
          B: "Hydrogen"
          C: "Nitrogen"
          D: "Carbon dioxide"
  - text: "Quel est l'élément le plus abondant dans l'atmosphère terrestre ?"
    answers:
      A: "L'oxygène"
      B: "L'azote"
      C: "L'hydrogène"
      D: "Le dioxyde de carbone"
    correctAnswer: B
    translations:
      en:
        text: "What is the most abundant element in Earth's atmosphere?"
        answers:
          A: "Oxygen"
          B: "Nitrogen"
          C: "Hydrogen"
          D: "Carbon dioxide"
  - text: "Quelle particule porte une charge électrique négative ?"
    answers:
      A: "L'électron"
      B: "Le neutron"
      C: "Le proton"
      D: "Le photon"
    correctAnswer: A
    translations:
      en:
        text: "Which particle carries a negative electric charge?"
        answers:
          A: "Electron"
          B: "Neutron"
          C: "Proton"
          D: "Photon"
  - text: "Où sont concentrés les protons et les neutrons d'un atome ?"
    answers:
      A: "Dans le nuage électronique"
      B: "Dans le noyau"
      C: "Dans les liaisons chimiques"
      D: "Dans le vide"
    correctAnswer: B
    translations:
      en:
        text: "Where are the protons and neutrons of an atom concentrated?"
        answers:
          A: "In the electron cloud"
          B: "In the nucleus"
          C: "In chemical bonds"
          D: "In a vacuum"
  - text: "Quelle molécule ce modèle représente-t-il ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Water-3D-balls.png?width=800
    answers:
      A: "Le méthane"
      B: "L'ammoniac"
      C: "Le dioxyde de carbone"
      D: "L'eau"
    correctAnswer: D
    translations:
      en:
        text: "Which molecule does this model represent?"
        answers:
          A: "Methane"
          B: "Ammonia"
          C: "Carbon dioxide"
          D: "Water"
  - text: "Quel est le pH d'une solution neutre à température ambiante ?"
    answers:
      A: "0"
      B: "10"
      C: "7"
      D: "14"
    correctAnswer: C
    translations:
      en:
        text: "What is the pH of a neutral solution at room temperature?"
        answers:
          A: "0"
          B: "10"
          C: "7"
          D: "14"
