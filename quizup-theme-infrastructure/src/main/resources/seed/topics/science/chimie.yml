        text: "Which acid is naturally present in lemons?"
        answers:
          A: "Acetic acid"
          B: "Lactic acid"
          C: "Sulfuric acid"
          D: "Citric acid"
  - text: "Quel métal est liquide à température ambiante ?"
    answers:
      A: "Le mercure"
      B: "Le fer"
      C: "L'aluminium"
      D: "Le cuivre"
    correctAnswer: A
    translations:
      en:
        text: "Which metal is liquid at room temperature?"
        answers:
          A: "Mercury"
          B: "Iron"
          C: "Aluminum"
          D: "Copper"
  - text: "Quel est le symbole chimique du carbone ?"
    answers:
      A: "Ca"
      B: "Co"
      C: "C"
      D: "Cr"
    correctAnswer: C
    translations:
      en:
        text: "What is the chemical symbol for carbon?"
        answers:
          A: "Ca"
          B: "Co"
          C: "C"
          D: "Cr"
  - text: "Qui est considéré comme le père de la chimie moderne ?"
    answers:
      A: "Louis Pasteur"
      B: "Antoine Lavoisier"
      C: "Dmitri Mendeleïev"
      D: "Niels Bohr"
    correctAnswer: B
    translations:
      en:
        text: "Who is considered the father of modern chemistry?"
        answers:
          A: "Louis Pasteur"
          B: "Antoine Lavoisier"
          C: "Dmitri Mendeleev"
          D: "Niels Bohr"
  - text: "Quel scientifique britannique a proposé la théorie atomique moderne ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/John_Dalton_by_Charles_Turner.jpg?width=800
    answers:
      A: "Isaac Newton"
