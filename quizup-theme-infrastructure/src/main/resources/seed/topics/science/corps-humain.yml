  description: "Explorez l'anatomie du corps humain : ses os, ses muscles, sa peau et ses organes vitaux. Ce thème couvre le cœur, les poumons, le foie, les reins, l'estomac, les intestins et le cerveau, ainsi que les appareils circulatoire, respiratoire et digestif, les groupes sanguins, les articulations et les records stables du corps humain."
