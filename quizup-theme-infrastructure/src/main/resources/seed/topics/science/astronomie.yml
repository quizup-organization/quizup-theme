        text: "Which planet is the hottest in the solar system?"
        answers:
          A: "Mercury"
          B: "Venus"
          C: "Mars"
          D: "Jupiter"
  - text: "Qu'est-ce qu'une comète ?"
    answers:
      A: "Une étoile filante"
      B: "Un corps glacé qui orbite autour du Soleil"
      C: "Un astéroïde géant"
      D: "Un satellite de Jupiter"
    correctAnswer: B
    translations:
      en:
        text: "What is a comet?"
        answers:
          A: "A shooting star"
          B: "An icy body that orbits the Sun"
          C: "A giant asteroid"
          D: "A moon of Jupiter"
  - text: "Quel télescope spatial a été lancé en 1990 ?"
    answers:
      A: "James Webb"
      B: "Hubble"
      C: "Spitzer"
      D: "Chandra"
    correctAnswer: B
    translations:
