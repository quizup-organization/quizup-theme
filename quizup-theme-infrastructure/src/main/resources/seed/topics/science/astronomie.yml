topic:
  id: topic-astronomie
  names:
    fr: "Astronomie"
    en: "Astronomy"
  description: "Explorez les planètes, les étoiles et les grands objets célestes : système solaire, Lune, missions spatiales et galaxies."
  category: SCIENCE
  imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/The_Earth_seen_from_Apollo_17.jpg?width=800
questions:
  - text: "Quelle planète est surnommée la planète bleue ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/The_Earth_seen_from_Apollo_17.jpg?width=800
    answers:
      A: "Jupiter"
      B: "Mars"
      C: "Vénus"
      D: "La Terre"
    correctAnswer: D
    translations:
      en:
        text: "Which planet is nicknamed the blue planet?"
        answers:
          A: "Jupiter"
          B: "Mars"
          C: "Venus"
          D: "Earth"
  - text: "Combien de planètes compte le système solaire ?"
    answers:
      A: "Huit"
      B: "Sept"
      C: "Six"
      D: "Neuf"
    correctAnswer: A
    translations:
      en:
        text: "How many planets are in the solar system?"
        answers:
          A: "Eight"
          B: "Seven"
          C: "Six"
          D: "Nine"
  - text: "Quelle est la plus grande planète du système solaire ?"
    answers:
      A: "Saturne"
      B: "Neptune"
      C: "Jupiter"
      D: "Uranus"
    correctAnswer: C
    translations:
      en:
        text: "What is the largest planet in the solar system?"
        answers:
          A: "Saturn"
          B: "Neptune"
          C: "Jupiter"
          D: "Uranus"
  - text: "Quel est le seul satellite naturel de la Terre ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/FullMoon2010.jpg?width=800
    answers:
      A: "Phobos"
      B: "La Lune"
      C: "Titan"
      D: "Europe"
    correctAnswer: B
    translations:
      en:
        text: "What is Earth's only natural satellite?"
        answers:
          A: "Phobos"
          B: "The Moon"
          C: "Titan"
          D: "Europa"
  - text: "Quelle planète est la plus proche du Soleil ?"
    answers:
      A: "Mercure"
      B: "Vénus"
      C: "Mars"
      D: "La Terre"
    correctAnswer: A
    translations:
      en:
        text: "Which planet is closest to the Sun?"
        answers:
          A: "Mercury"
          B: "Venus"
          C: "Mars"
          D: "Earth"
  - text: "Quelle planète est surnommée la planète rouge ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/OSIRIS_Mars_true_color.jpg?width=800
    answers:
      A: "Mars"
      B: "Jupiter"
      C: "Vénus"
      D: "Mercure"
    correctAnswer: A
    translations:
      en:
        text: "Which planet is nicknamed the red planet?"
        answers:
          A: "Mars"
          B: "Jupiter"
          C: "Venus"
          D: "Mercury"
  - text: "Quel est le nom de notre étoile ?"
    answers:
      A: "Sirius"
      B: "Alpha du Centaure"
      C: "Proxima du Centaure"
      D: "Le Soleil"
    correctAnswer: D
    translations:
      en:
        text: "What is the name of our star?"
        answers:
          A: "Sirius"
          B: "Alpha Centauri"
          C: "Proxima Centauri"
          D: "The Sun"
  - text: "Quelle mission a permis à l'Homme de marcher sur la Lune pour la première fois ?"
    answers:
      A: "Apollo 8"
      B: "Gemini 4"
      C: "Apollo 13"
      D: "Apollo 11"
    correctAnswer: D
    translations:
      en:
        text: "Which mission first allowed humans to walk on the Moon?"
        answers:
          A: "Apollo 8"
          B: "Gemini 4"
          C: "Apollo 13"
          D: "Apollo 11"
  - text: "En quelle année l'Homme a-t-il marché sur la Lune pour la première fois ?"
    answers:
      A: "1969"
      B: "1965"
      C: "1959"
      D: "1972"
    correctAnswer: A
    translations:
      en:
        text: "In what year did humans first walk on the Moon?"
        answers:
          A: "1969"
          B: "1965"
          C: "1959"
          D: "1972"
  - text: "Combien de temps la Terre met-elle environ pour faire un tour complet du Soleil ?"
    answers:
      A: "24 heures"
      B: "30 jours"
      C: "365 jours"
      D: "10 ans"
    correctAnswer: C
    translations:
      en:
        text: "About how long does Earth take to complete one orbit around the Sun?"
        answers:
          A: "24 hours"
          B: "30 days"
          C: "365 days"
          D: "10 years"
  - text: "Quelle est cette planète aux anneaux les plus spectaculaires ?"
    imageUrl: https://commons.wikimedia.org/wiki/Special:FilePath/Saturn_during_Equinox.jpg?width=800
    answers:
      A: "Jupiter"
      B: "Uranus"
      C: "Saturne"
      D: "Neptune"
    correctAnswer: C
    translations:
      en:
        text: "Which planet has the most spectacular rings?"
        answers:
          A: "Jupiter"
          B: "Uranus"
          C: "Saturn"
          D: "Neptune"
  - text: "Combien de temps la lumière du Soleil met-elle environ pour atteindre la Terre ?"
    answers:
      A: "8 heures"
      B: "8 secondes"
      C: "8 minutes"
      D: "1 jour"
    correctAnswer: C
    translations:
      en:
        text: "About how long does sunlight take to reach Earth?"
        answers:
          A: "8 hours"
          B: "8 seconds"
          C: "8 minutes"
          D: "1 day"
  - text: "Quelle galaxie abrite le système solaire ?"
    answers:
      A: "Andromède"
      B: "La galaxie du Sombrero"
      C: "Le Grand Nuage de Magellan"
      D: "La Voie lactée"
    correctAnswer: D
    translations:
      en:
        text: "Which galaxy contains the solar system?"
        answers:
          A: "Andromeda"
          B: "The Sombrero Galaxy"
          C: "The Large Magellanic Cloud"
          D: "The Milky Way"
  - text: "Qui a été la première femme à voyager dans l'espace ?"
    answers:
      A: "Valentina Terechkova"
      B: "Christa McAuliffe"
      C: "Svetlana Savitskaya"
      D: "Sally Ride"
