        text: "Which space telescope was launched in 1990?"
        answers:
          A: "James Webb"
          B: "Hubble"
          C: "Spitzer"
          D: "Chandra"
  - text: "Quelle planète est la plus éloignée du Soleil ?"
    answers:
      A: "Uranus"
