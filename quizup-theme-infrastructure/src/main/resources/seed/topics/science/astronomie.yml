          A: "Valentina Tereshkova"
          B: "Christa McAuliffe"
          C: "Svetlana Savitskaya"
          D: "Sally Ride"
  - text: "Qui a été le premier être humain à voyager dans l'espace ?"
    answers:
      A: "Neil Armstrong"
      B: "John Glenn"
      C: "Alan Shepard"
      D: "Youri Gagarine"
    correctAnswer: D
