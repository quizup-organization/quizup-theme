          D: "Yuri Gagarin"
  - text: "Quelle planète est la plus chaude du système solaire ?"
    answers:
      A: "Mercure"
      B: "Vénus"
      C: "Mars"
      D: "Jupiter"
    correctAnswer: B
    translations:
