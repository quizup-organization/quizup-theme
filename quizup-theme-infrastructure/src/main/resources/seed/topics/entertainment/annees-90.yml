    en: "The 90s"
  description: "Plongez dans la culture populaire des années 1990, en France et dans le monde : les tubes dance et les boys bands, le rap français, le grunge, les séries cultes comme Friends ou X-Files, les dessins animés Dragon Ball et Pokémon, et les grands films de l'époque comme Titanic, Matrix ou Le Roi Lion. Un voyage nostalgique à travers une décennie riche en hits, en héros et en souvenirs inoubliables."
  category: ENTERTAINMENT
