topic:
  id: topic-eurovision
  names:
    fr: "Eurovision"
    en: "Eurovision"
  description: "L'Eurovision est le plus grand concours de chansons au monde, créé en 1956 par l'Union européenne de radio-télévision. Chaque année, des pays s'affrontent lors de demi-finales puis d'une grande finale, départagés par les jurys et le télévote du public. D'ABBA à Céline Dion en passant par Loreen, le concours a révélé des artistes légendaires et réunit des millions de téléspectateurs."
  category: ENTERTAINMENT
  titles:
    fr:
      NOVICE: "Chanteur sous la douche"
      APPRENTI: "Candidat de présélection"
      PRATIQUANT: "Finaliste national"
      CONFIRME: "Représentant à l'Eurovision"
      EXPERT: "Champion du télévote"
      MAITRE: "Vainqueur du concours"
      LEGENDE: "Légende de l'Eurovision"
    en:
      NOVICE: "Shower Singer"
      APPRENTI: "National Selection Hopeful"
      PRATIQUANT: "National Finalist"
      CONFIRME: "Eurovision Contestant"
      EXPERT: "Televote Champion"
      MAITRE: "Eurovision Winner"
      LEGENDE: "Eurovision Legend"
  imageUrl: wikipedia/entertainment/Eurovision_Song_Contest_2025_Stage.jpg
