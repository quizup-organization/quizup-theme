# Lot « acquisition » — nouveaux thèmes (1 licence / fiction par thème).
#
# Consommé par seed/run-acquisition.py (phase `new`). Contenu **durci** (cible de difficulté
# 10/20/35/35) ; texte des questions imagées ≤ 60 caractères.
#
# `image_url` : URL Wikimedia Commons absolue (mirorée ensuite côté workspace par
# `make seed-images ACTION=fetch|rewrite|check|publish`). Vide = couverture à ajouter plus tard
# (fallback UI en attendant).
themes:
  - id: topic-naruto
